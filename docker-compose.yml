services:
  postgres:
    image: postgres:16-alpine
    container_name: skeleton-postgres
    environment:
      POSTGRES_USER: skeleton
      POSTGRES_PASSWORD: skeleton_dev
      POSTGRES_DB: skeleton_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/schema.postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skeleton -d skeleton_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
