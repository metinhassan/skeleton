<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skeleton App - Login</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <!-- Login View -->
      <div id="login-view" class="view">
        <div class="login-container">
          <div class="login-card">
            <h1 class="login-title">Welcome</h1>
            <p class="login-subtitle">Sign in to continue</p>

            <form id="login-form" class="login-form">
              <div class="form-group">
                <label for="email">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  autocomplete="email"
                  required
                />
              </div>

              <div class="form-group">
                <label for="password">Password</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  required
                />
              </div>

              <div id="error-message" class="error-message" hidden></div>

              <button type="submit" id="login-btn" class="btn btn-primary">
                <span class="btn-text">Sign In</span>
                <span class="btn-loading" hidden>Signing in...</span>
              </button>
            </form>

            <div class="login-footer">
              <p class="hint">
                Don't have an account?
                <a href="#" id="switch-to-register" class="link">Sign up</a>
              </p>
              <p class="hint">
                Demo: <code>admin@example.com / admin123</code>
              </p>
            </div>
          </div>
        </div>
      </div>

      <!-- Registration View -->
      <div id="register-view" class="view" hidden></div>

      <!-- Dashboard View (shown after login) -->
      <div id="dashboard-view" class="view" hidden>
        <header class="dashboard-header">
          <h1>Dashboard</h1>
          <div class="user-info">
            <span id="user-name"></span>
            <button id="edit-profile-btn" class="btn btn-outline">Edit Profile</button>
            <button id="logout-btn" class="btn btn-secondary">Logout</button>
          </div>
        </header>

        <main class="dashboard-content">
          <div class="welcome-card">
            <h2>Welcome to Skeleton App</h2>
            <p>You are now logged in. This is your starting point for building amazing applications.</p>
          </div>
        </main>
      </div>

      <!-- Profile Edit View -->
      <div id="profile-view" class="view" hidden></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
