<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skeleton App - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <!-- Login View -->
      <div id="login-view" class="view" hidden>
        <div class="login-container">
          <div class="login-card">
            <h1 class="login-title">Welcome</h1>
            <p class="login-subtitle">Sign in to continue</p>

            <form id="login-form" class="login-form">
              <div class="form-group">
                <label for="email">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  autocomplete="email"
                  required
                />
              </div>

              <div class="form-group">
                <label for="password">Password</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  required
                />
              </div>

              <div id="error-message" class="error-message" hidden></div>

              <button type="submit" id="login-btn" class="btn btn-primary">
                <span class="btn-text">Sign In</span>
                <span class="btn-loading" hidden>Signing in...</span>
              </button>
            </form>

            <div class="login-footer">
              <p class="hint">
                Don't have an account?
                <a href="#" id="switch-to-register" class="link">Sign up</a>
              </p>
              <p class="hint">
                Demo: <code>admin@example.com / admin123</code>
              </p>
            </div>
          </div>
        </div>
      </div>

      <!-- Registration View -->
      <div id="register-view" class="view" hidden></div>

      <!-- App Shell Container (main authenticated layout) -->
      <div id="app-shell-container" class="view" hidden></div>

      <!-- Dashboard Content (injected into app shell) -->
      <template id="dashboard-content">
        <div class="welcome-card">
          <h2 id="user-name">Welcome</h2>
          <p>You are now logged in. This is your starting point for building amazing applications.</p>
          <button id="edit-profile-btn" class="btn btn-outline" style="margin-top: 1rem;">Edit Profile</button>
        </div>
        <div class="welcome-card" style="margin-top: 1rem;">
          <h2>Live Scoring (Demo)</h2>
          <p>Access live scoring and spectator views using these routes:</p>
          <ul style="margin: 1rem 0; padding-left: 1.5rem; color: var(--color-text-muted);">
            <li><code>#/clubs/{clubId}/matches/{matchId}/score</code> - Organiser scoring (auth required)</li>
            <li><code>#/live/{competition-slug}</code> - Public live scores</li>
            <li><code>#/live/match/{matchId}</code> - Public match detail</li>
            <li><code>#/competitions/{slug}/bracket</code> - Bracket/standings view</li>
          </ul>
          <div class="demo-links" id="demo-links"></div>
        </div>
      </template>

      <!-- Legacy Dashboard View (kept for backward compatibility during transition) -->
      <div id="dashboard-view" class="view" hidden></div>

      <!-- Profile Edit View -->
      <div id="profile-view" class="view" hidden></div>

      <!-- Live Scoring View (for match organisers) -->
      <div id="live-scoring-view" class="view" hidden></div>

      <!-- Public Live Scores View (no auth required) -->
      <div id="public-live-view" class="view" hidden></div>

      <!-- Public Match View (no auth required) -->
      <div id="public-match-view" class="view" hidden></div>

      <!-- Bracket View (no auth required) -->
      <div id="bracket-view" class="view" hidden></div>

      <!-- Public Registration View (no auth required for viewing, auth for submitting) -->
      <div id="public-registration-view" class="view" hidden></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
